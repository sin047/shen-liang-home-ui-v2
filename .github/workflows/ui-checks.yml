name: UI v2 smoke checks
on:
  pull_request:
  push:
    branches: [main, 'preview/ui-v2-iphone']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser JavaScript syntax
        run: |
          node --check src/material/glass-material-kit-v05.js
          node --check src/material/glass-adapter.js
          node --check src/app.js
          node --check tests/check-preview.cjs
      - name: Check source provenance and shell wiring
        run: node tests/check-preview.cjs
      - name: Check static GitHub Pages readiness
        if: startsWith(github.ref, 'refs/heads/preview/')
        run: node tests/check-pages-preview.cjs
      - name: Check frozen v1 public reference
        run: |
          if [ -f legacy-original/chat-preview.html ]; then
            node tests/check-legacy-v1-reference.cjs
          fi
      - name: Check material-only V1 layout immutability
        run: |
          if [ -f material-only/chat-preview.html ]; then
            node tests/check-material-only.cjs
          fi
